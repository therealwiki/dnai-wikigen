name: Build TEE Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
      - "tinker-*"
    paths:
      - ".github/workflows/build-tee-images.yml"
      - "⚙️/tinker-delegate/**"
      - "⚙️/tee-email-oracle/**"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
  artifact-metadata: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: tinker-delegate
            context: ./⚙️/tinker-delegate
            dockerfile: ./⚙️/tinker-delegate/Dockerfile
            image_suffix: tinker-delegate
          - name: tee-email-oracle
            context: ./⚙️/tee-email-oracle
            dockerfile: ./⚙️/tee-email-oracle/Dockerfile
            image_suffix: tee-email-oracle
          - name: neko-chrome
            context: ./⚙️/tee-email-oracle/neko-chrome
            dockerfile: ./⚙️/tee-email-oracle/neko-chrome/Dockerfile
            image_suffix: neko-chrome

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve lowercase image namespace
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${REGISTRY}/${repository}/${{ matrix.image_suffix }}" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=dnai-wikigen ${{ matrix.name }}
            org.opencontainers.image.description=Private TEE service image for dnai-wikigen
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push image with SBOM and provenance
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.name }}.spdx.json
          artifact-name: ${{ matrix.name }}-sbom.spdx.json
          upload-artifact: true

      - name: Generate GitHub provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate GitHub SBOM attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ matrix.name }}.spdx.json
          push-to-registry: true

      - name: Print bounded image evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### ${{ matrix.name }}"
            echo
            echo "- image: \`${{ steps.image.outputs.name }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- buildkit-sbom: registry-attached"
            echo "- buildkit-provenance: registry-attached"
            echo "- github-sbom-attestation: registry-attached"
            echo "- github-provenance-attestation: registry-attached"
            echo
            echo "Tags:"
            echo
            echo '```text'
            printf '%s\n' '${{ steps.meta.outputs.tags }}'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
