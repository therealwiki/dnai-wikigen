name: CI

on:
  # Build TEE Images calls this exact workflow before it is allowed to publish
  # any registry subject. Keep the reusable invocation byte-identical to the
  # pull-request and branch gates so a release cannot pass a narrower test set.
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "tinker-*"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Scan tracked files for secret-shaped material
        run: scripts/verify-local.sh secrets

  contracts:
    name: Foundry Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: stable
      - name: Install locked release-tool dependencies
        working-directory: web
        run: npm ci
      - name: Build and test contracts
        run: scripts/verify-local.sh foundry

  python:
    name: Python Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install locked release-tool dependencies
        working-directory: web
        run: npm ci
      - name: Sync, compile, and test Python packages
        run: scripts/verify-local.sh python

  web:
    name: SolidJS Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci
      - name: Verify all release and activation tooling
        run: node --test scripts/*.test.mjs
      - name: Typecheck, test, build, headers, and dependency audit
        working-directory: web
        run: npm run check
