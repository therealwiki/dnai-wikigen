name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "tinker-*"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for secret-shaped material
        run: scripts/verify-local.sh secrets

  contracts:
    name: Foundry Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build and test contracts
        run: scripts/verify-local.sh foundry

  python:
    name: Python Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync, compile, and test Python packages
        run: scripts/verify-local.sh python
