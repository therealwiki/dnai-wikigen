            exit 64
          fi
          umask 022
          /bin/mkdir -m 0700 -- "$runtime_root"
          /usr/bin/install -d -m 0755 -- \
            "$runtime_root/bin" "$runtime_root/lib/node_modules"
          /usr/bin/install -m 0755 -- "$source_node" "$runtime_root/bin/node"
          # Hosted toolcache permissions need not match the upstream npm tree.
          # Restore npm from the reviewed archive before its full-tree check.
          /usr/bin/curl -fsSL --retry 3 --proto '=https' --proto-redir '=https' \
            https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz \
            -o "$runtime_root/node.tar.xz"
          /usr/bin/printf '%s  %s\n' \
            d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307 \
            "$runtime_root/node.tar.xz" | /usr/bin/sha256sum --check --status
          /bin/tar -xJf "$runtime_root/node.tar.xz" -C "$runtime_root" \
            --strip-components=1 --no-same-owner --no-same-permissions \
            node-v22.23.2-linux-x64/lib/node_modules/npm
          /bin/rm -- "$runtime_root/node.tar.xz"
          /bin/ln -s ../lib/node_modules/npm/bin/npm-cli.js "$runtime_root/bin/npm"
          /usr/bin/printf '%s\n' "$runtime_root/bin" >> "$GITHUB_PATH"
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.5.1
      - name: Build contracts with portable Node suites — not operator-host activation authority
        # The hosted runner is the trusted process-launch boundary for this
        # non-authorizing portable proof as well as for the web gate below.
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        run: |
          set +x
          gate="$(/usr/bin/mktemp "$RUNNER_TEMP/dnai-verify-local.XXXXXX")"
          trap '/bin/rm -f -- "$gate"' EXIT
          /usr/bin/env -i HOME="$HOME" PATH=/usr/bin:/bin LANG=C LC_ALL=C \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            GIT_OPTIONAL_LOCKS=0 GIT_NO_REPLACE_OBJECTS=1 GIT_PAGER=cat \
            /usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null \
              -C "$GITHUB_WORKSPACE" show \
              "$GITHUB_SHA:scripts/verify-local.sh" > "$gate"
          /bin/chmod 0755 "$gate"
          /usr/bin/env -i HOME="$HOME" PATH="$PATH" CI=true \
            /bin/bash -p "$gate" --head-materialized-root \
              "$GITHUB_WORKSPACE" "$GITHUB_SHA" foundry-ci

