          /bin/ln -s ../lib/node_modules/npm/bin/npm-cli.js "$runtime_root/bin/npm"
          /usr/bin/printf '%s\n' "$runtime_root/bin" >> "$GITHUB_PATH"
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.5.1
      - name: Canonicalize generic Linux cast for rejection evidence
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        run: |
          set -euo pipefail
          cast_source="$(/usr/bin/realpath "$HOME/.foundry/bin/cast")"
          /usr/bin/install -m 0755 "$cast_source" "$RUNNER_TEMP/dnai-generic-linux-cast"
          /bin/rm -f "$HOME/.foundry/bin/cast"
          /usr/bin/install -m 0755 "$RUNNER_TEMP/dnai-generic-linux-cast" \
            "$HOME/.foundry/bin/cast"
      - name: Verify generic-Linux portable web and root gates — not operator-host activation authority
        # The hosted runner is the trusted process-launch boundary. Native
        # constructors execute before Bash can inspect its own environment, so
        # loader variables must be empty when the runner creates the process.
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        run: |
          set +x
          gate="$(/usr/bin/mktemp "$RUNNER_TEMP/dnai-verify-local.XXXXXX")"
          trap '/bin/rm -f -- "$gate"' EXIT
          /usr/bin/env -i HOME="$HOME" PATH=/usr/bin:/bin LANG=C LC_ALL=C \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            GIT_OPTIONAL_LOCKS=0 GIT_NO_REPLACE_OBJECTS=1 GIT_PAGER=cat \
            /usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null \
              -C "$GITHUB_WORKSPACE" show \
              "$GITHUB_SHA:scripts/verify-local.sh" > "$gate"
          /bin/chmod 0755 "$gate"
          /usr/bin/env -i HOME="$HOME" PATH="$PATH" CI=true \
            /bin/bash -p "$gate" --head-materialized-root \
              "$GITHUB_WORKSPACE" "$GITHUB_SHA" web-ci
