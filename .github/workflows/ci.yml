name: CI

on:
  # Build TEE Images calls this exact workflow before it is allowed to publish
  # any registry subject. Keep the reusable invocation byte-identical to the
  # pull-request and branch gates so a release cannot pass a narrower test set.
  # Generic Linux proves portable source logic only. It cannot satisfy the
  # frozen Darwin operator authorities; live activation separately requires
  # the exact-HEAD materialized wrapper in `operator-host` mode on the reviewed
  # operator machine. A mutable worktree script is not bootstrap authority.
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "tinker-*"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Canonicalize pinned Node release authority
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        run: |
          set -euo pipefail
          source_node="$(type -P node)"
          runtime_root="$RUNNER_TEMP/dnai-node-22.23.2"
          if [[ "$source_node" != /* \
            || "$source_node" != "$(/usr/bin/readlink -f -- "$source_node")" \
            || "$(/usr/bin/sha256sum -- "$source_node")" \
              != "3517c2df0b2f8cd7f422b4b8450ef81c6889f08eb03e281d6de9079b15e6a327  $source_node" \
            || -e "$runtime_root" || -L "$runtime_root" ]]; then
            echo "setup-node did not provide the reviewed Node v22.23.2 Linux x64 runtime" >&2
            exit 64
          fi
          umask 022
          /bin/mkdir -m 0700 -- "$runtime_root"
          /usr/bin/install -d -m 0755 -- \
            "$runtime_root/bin" "$runtime_root/lib/node_modules"
          /usr/bin/install -m 0755 -- "$source_node" "$runtime_root/bin/node"
          # Hosted toolcache permissions need not match the upstream npm tree.
          # Restore npm from the reviewed archive before its full-tree check.
          /usr/bin/curl -fsSL --retry 3 --proto '=https' --proto-redir '=https' \
            https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz \
            -o "$runtime_root/node.tar.xz"
          /usr/bin/printf '%s  %s\n' \
            d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307 \
            "$runtime_root/node.tar.xz" | /usr/bin/sha256sum --check --status
          /bin/tar -xJf "$runtime_root/node.tar.xz" -C "$runtime_root" \
            --strip-components=1 --no-same-owner --no-same-permissions \
            node-v22.23.2-linux-x64/lib/node_modules/npm
          /bin/rm -- "$runtime_root/node.tar.xz"
          /bin/ln -s ../lib/node_modules/npm/bin/npm-cli.js "$runtime_root/bin/npm"
          /usr/bin/printf '%s\n' "$runtime_root/bin" >> "$GITHUB_PATH"
      - name: Scan tracked files for secret-shaped material
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        run: |
          set +x
          gate="$(/usr/bin/mktemp "$RUNNER_TEMP/dnai-verify-local.XXXXXX")"
          trap '/bin/rm -f -- "$gate"' EXIT
          /usr/bin/env -i HOME="$HOME" PATH=/usr/bin:/bin LANG=C LC_ALL=C \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            GIT_OPTIONAL_LOCKS=0 GIT_NO_REPLACE_OBJECTS=1 GIT_PAGER=cat \
            /usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null \
              -C "$GITHUB_WORKSPACE" show \
              "$GITHUB_SHA:scripts/verify-local.sh" > "$gate"
          /bin/chmod 0755 "$gate"
          /usr/bin/env -i HOME="$HOME" PATH="$PATH" CI=true \
            /bin/bash -p "$gate" --head-materialized-root \
              "$GITHUB_WORKSPACE" "$GITHUB_SHA" secrets

