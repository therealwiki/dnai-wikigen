[project]
name = "tee-email-oracle"
version = "0.1.0"
description = "TEE Email Oracle — account creation + pin extraction service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.27",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "cryptography>=44.0",
    "playwright>=1.49",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "dstack-sdk>=0.5.2",
    "eth-hash[pycryptodome]>=0.7.1",
    "cockli-captcha-solver",
]

[project.scripts]
email-oracle = "email_oracle.main:cli"

[tool.uv.sources]
cockli-captcha-solver = { path = "./captcha-solver" }

[tool.hatch.build.targets.wheel]
packages = ["email_oracle"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
