[project]
name = "cockli-captcha-solver"
version = "0.1.0"
description = "CPU-only OCR solver for cock.li CSS box-shadow captchas"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.scripts]
solve-captcha = "captcha_solver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["captcha_solver"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
