      ORACLE_COCKLI_DOMAIN: ${ORACLE_DOMAIN:-cock.email}
      ORACLE_API_HOST: 0.0.0.0
      ORACLE_API_PORT: "8000"
      ORACLE_PRODUCTION_RELEASE: "true"
      ORACLE_DSTACK_ENABLED: "true"
      ORACLE_DSTACK_KEY_PATH: email/creds
      ORACLE_RUNTIME_AUTH_REQUIRED: "true"
      ORACLE_RUNTIME_AUTH_TOKEN: ""
      ORACLE_RUNTIME_AUTH_KEY_PATH: oracle/runtime-auth
      ORACLE_AUTH_REQUIRED: "true"
      ORACLE_AUTH_CONTRACT_ADDRESS: ${EMAIL_ORACLE_AUTH_ADDRESS:?Fresh EmailOracleAuth address required}
      ORACLE_AUTH_RPC_URL: ${BASE_SEPOLIA_RPC_URL:?Primary Base Sepolia HTTPS RPC URL required}
      ORACLE_AUTH_RPC_URL_SECONDARY: ${BASE_SEPOLIA_RPC_URL_SECONDARY:?Independent secondary Base Sepolia HTTPS RPC URL required}
      ORACLE_AUTH_CHAIN_ID: "84532"
      ORACLE_AUTH_CONTRACT_RUNTIME_CODE_HASH: ${EMAIL_ORACLE_AUTH_RUNTIME_CODE_HASH:?EmailOracleAuth runtime code hash required}
      ORACLE_AUTH_CONSUMER_APP_ID: ${EMAIL_ORACLE_CONSUMER_APP_ID:?Release-bound main CVM TEE identity required}
      ORACLE_AUTH_CONSUMER_COMPOSE_HASH: ${EMAIL_ORACLE_CONSUMER_COMPOSE_HASH:?Release-bound main CVM compose hash required}
      ORACLE_AUTH_EXPECTED_CALLER_IDENTITY: tinker-delegate.signup
      ORACLE_AUTH_MAX_FINALIZED_BLOCK_AGE_SECONDS: "900"
      ORACLE_AUTH_MAX_FUTURE_BLOCK_SKEW_SECONDS: "30"
      ORACLE_AUTH_CHECKPOINT_STORE_PATH: /data/email_auth_checkpoint.json
      ORACLE_OTP_REPLAY_STORE_PATH: /data/otp_replay.enc
      ORACLE_OTP_REPLAY_STORE_KEY: ""
      ORACLE_OTP_REPLAY_KEY_PATH: email/otp_replay
      ORACLE_ALLOW_CREDENTIAL_PROVISIONING_ENDPOINT: "false"
      ORACLE_CREDENTIAL_PROVISIONING_TOKEN: ""
