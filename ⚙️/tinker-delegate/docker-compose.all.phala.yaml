      TINKER_COLLABORATION_EXECUTION_RELEASE_VERIFICATION_SHA256: ${TINKER_COLLABORATION_EXECUTION_RELEASE_VERIFICATION_SHA256:-}
      TINKER_COLLABORATION_EXECUTION_GRANT_TTL_SECONDS: "300"
      TINKER_COLLABORATION_EXECUTION_ROYALTY_RESERVATION_SAFETY_SECONDS: ${TINKER_COLLABORATION_EXECUTION_ROYALTY_RESERVATION_SAFETY_SECONDS:-900}
      TINKER_ROYALTY_DISTRIBUTOR_ADDRESS: ${TINKER_ROYALTY_DISTRIBUTOR_ADDRESS:-}
      TINKER_ROYALTY_DISTRIBUTOR_RUNTIME_CODE_HASH: ${TINKER_ROYALTY_DISTRIBUTOR_RUNTIME_CODE_HASH:-}
      TINKER_ROYALTY_OWNER_ADDRESS: ${TINKER_ROYALTY_OWNER_ADDRESS:-}
      TINKER_ROYALTY_AUTHORITY_NONCE: ${TINKER_ROYALTY_AUTHORITY_NONCE:-}
      TINKER_ROYALTY_SETTLEMENT_VERIFIER: ${TINKER_ROYALTY_SETTLEMENT_VERIFIER:-}
      TINKER_ROYALTY_QVL_VERIFIER: ${TINKER_ROYALTY_QVL_VERIFIER:-}
