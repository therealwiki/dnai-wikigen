###############################################################################
# Unified Cross-Compose — registry-image deployment for Phala Cloud
#
# This file is purpose-built for `phala deploy`. Unlike the local compose, it
# does not reference local build contexts; every service uses a published image.
#
# ARENA RELEASE GATE: the currently pinned tinker-delegate digest predates the
# tinker-arena-worker module/entrypoint and the authenticated
# tinker-arena-provision initializer. Do not add either service by reusing that
# digest. First publish a clean-CI linux/amd64 image, pin its literal digest,
# then add the network-disabled initializer and gated internal worker together.
#
# ANCHOR-WRITER EVIDENCE RELEASE GATE: the same pinned delegate digest was
# inspected directly and contains neither the
# `tinker-execution-policy-anchor-writer` entrypoint nor its Python module.
# Consequently this production compose intentionally has no writer-evidence
# service and the QVL bearer is absent from `delegate`. Commit a reviewed clean
# SHA, publish/prove a new linux/amd64 delegate image in clean CI, pin its literal
# digest here, and only then add the isolated profile-gated one-shot service.
###############################################################################

services:
  neko:
    # Historical project-owned digest used by earlier diagnostics only. It is
    # not release-eligible for a new source SHA: rebuild from a reproducible
    # Chrome artifact in clean CI, verify provenance/SBOM, then re-pin here.
    image: ghcr.io/g-structure/dnai-wikigen/neko-chrome@sha256:525e43d585828d1d9aa1bceaf7c8cfffc2eec47abf67e0b10550bf05338c4a07
    platform: linux/amd64
    restart: unless-stopped
    shm_size: 2gb
    ulimits:
      core: 0
    cap_add:
      - SYS_ADMIN
    networks:
      tee-net:
        ipv4_address: 172.20.0.3
    environment:
      NEKO_SCREEN: 1920x1080@30
      NEKO_PASSWORD: ${NEKO_PASSWORD:?NEKO_PASSWORD must be a non-default secret}
      NEKO_PASSWORD_ADMIN: ${NEKO_PASSWORD_ADMIN:?NEKO_PASSWORD_ADMIN must be a non-default secret}
      NEKO_ICELITE: 0
      NEKO_NAT1TO1: 172.20.0.3
    entrypoint:
      - /bin/sh
      - -euc
      - |
        if [ "$${NEKO_PASSWORD}" = "neko" ] || [ "$${NEKO_PASSWORD_ADMIN}" = "admin" ]; then
          echo "refusing default Neko credentials" >&2
          exit 78
        fi
        if [ "$${NEKO_PASSWORD}" = "$${NEKO_PASSWORD_ADMIN}" ]; then
          echo "refusing identical Neko user and administrator credentials" >&2
          exit 78
        fi
        exec /usr/bin/supervisord -c /etc/neko/supervisord.conf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      retries: 5
      timeout: 5s

  oracle:
