###############################################################################
# Unified Cross-Compose — registry-image deployment for Phala Cloud
#
# This file is purpose-built for `phala deploy`. Unlike the local compose, it
# does not reference local build contexts; every service uses a published image.
#
# ARENA RELEASE GATE: the currently pinned tinker-delegate digest predates the
# tinker-arena-worker module/entrypoint and the authenticated
# tinker-arena-provision initializer. Do not add either service by reusing that
# digest. First publish a clean-CI linux/amd64 image, pin its literal digest,
# then add the network-disabled initializer and gated internal worker together.
#
# ANCHOR-WRITER EVIDENCE RELEASE GATE: the same pinned delegate digest was
# inspected directly and contains neither the
# `tinker-execution-policy-anchor-writer` entrypoint nor its Python module.
# Consequently this production compose intentionally has no writer-evidence
# service and the QVL bearer is absent from `delegate`. Commit a reviewed clean
# SHA, publish/prove a new linux/amd64 delegate image in clean CI, pin its literal
# digest here, and only then add the isolated profile-gated one-shot service.
###############################################################################

services:
  neko:
    # Historical project-owned digest used by earlier diagnostics only. It is
    # not release-eligible for a new source SHA: rebuild from a reproducible
    # Chrome artifact in clean CI, verify provenance/SBOM, then re-pin here.
    image: ghcr.io/g-structure/dnai-wikigen/neko-chrome@sha256:525e43d585828d1d9aa1bceaf7c8cfffc2eec47abf67e0b10550bf05338c4a07
    platform: linux/amd64
    restart: unless-stopped
    shm_size: 2gb
    ulimits:
      core: 0
    cap_add:
      - SYS_ADMIN
    networks:
      tee-net:
        ipv4_address: 172.20.0.3
    environment:
      NEKO_SCREEN: 1920x1080@30
      NEKO_PASSWORD: ${NEKO_PASSWORD:?NEKO_PASSWORD must be a non-default secret}
      NEKO_PASSWORD_ADMIN: ${NEKO_PASSWORD_ADMIN:?NEKO_PASSWORD_ADMIN must be a non-default secret}
      NEKO_ICELITE: 0
      NEKO_NAT1TO1: 172.20.0.3
    entrypoint:
      - /bin/sh
      - -euc
      - |
        if [ "$${NEKO_PASSWORD}" = "neko" ] || [ "$${NEKO_PASSWORD_ADMIN}" = "admin" ]; then
          echo "refusing default Neko credentials" >&2
          exit 78
        fi
        if [ "$${NEKO_PASSWORD}" = "$${NEKO_PASSWORD_ADMIN}" ]; then
          echo "refusing identical Neko user and administrator credentials" >&2
          exit 78
        fi
        exec /usr/bin/supervisord -c /etc/neko/supervisord.conf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      retries: 5
      timeout: 5s

  oracle:
    image: ghcr.io/g-structure/dnai-wikigen/tee-email-oracle@sha256:ac5d30a8150d840dcbef28f87444fa1916e99fc301c4287db281a9f0d3d48401
    platform: linux/amd64
    restart: unless-stopped
    ulimits:
      core: 0
    depends_on:
      neko:
        condition: service_healthy
    networks:
      tee-net:
        ipv4_address: 172.20.0.4
    volumes:
      - oracle-data:/data
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      ORACLE_CRED_STORE_PATH: /data/credentials.enc
      ORACLE_CRED_STORE_KEY: ""
      ORACLE_CDP_URL: http://172.20.0.3:9222
      ORACLE_USE_BROWSER_FALLBACK: ${ORACLE_USE_BROWSER_FALLBACK:-true}
      ORACLE_AUTO_GENESIS: "false"
      ORACLE_COCKLI_DOMAIN: ${ORACLE_DOMAIN:-cock.email}
      ORACLE_API_HOST: 0.0.0.0
      ORACLE_API_PORT: "8000"
      ORACLE_PRODUCTION_RELEASE: "true"
      ORACLE_DSTACK_ENABLED: "true"
      ORACLE_DSTACK_KEY_PATH: email/creds
      ORACLE_RUNTIME_AUTH_REQUIRED: "true"
      ORACLE_RUNTIME_AUTH_TOKEN: ""
      ORACLE_RUNTIME_AUTH_KEY_PATH: oracle/runtime-auth
      ORACLE_AUTH_REQUIRED: "true"
      ORACLE_AUTH_CONTRACT_ADDRESS: ${EMAIL_ORACLE_AUTH_ADDRESS:?Fresh EmailOracleAuth address required}
      ORACLE_AUTH_RPC_URL: ${BASE_SEPOLIA_RPC_URL:?Primary Base Sepolia HTTPS RPC URL required}
      ORACLE_AUTH_RPC_URL_SECONDARY: ${BASE_SEPOLIA_RPC_URL_SECONDARY:?Independent secondary Base Sepolia HTTPS RPC URL required}
      ORACLE_AUTH_CHAIN_ID: "84532"
      ORACLE_AUTH_CONTRACT_RUNTIME_CODE_HASH: ${EMAIL_ORACLE_AUTH_RUNTIME_CODE_HASH:?EmailOracleAuth runtime code hash required}
      ORACLE_AUTH_CONSUMER_APP_ID: ${EMAIL_ORACLE_CONSUMER_APP_ID:?Release-bound main CVM TEE identity required}
      ORACLE_AUTH_CONSUMER_COMPOSE_HASH: ${EMAIL_ORACLE_CONSUMER_COMPOSE_HASH:?Release-bound main CVM compose hash required}
      ORACLE_AUTH_EXPECTED_CALLER_IDENTITY: tinker-delegate.signup
      ORACLE_AUTH_MAX_FINALIZED_BLOCK_AGE_SECONDS: "900"
      ORACLE_AUTH_MAX_FUTURE_BLOCK_SKEW_SECONDS: "30"
      ORACLE_AUTH_CHECKPOINT_STORE_PATH: /data/email_auth_checkpoint.json
      ORACLE_OTP_REPLAY_STORE_PATH: /data/otp_replay.enc
      ORACLE_OTP_REPLAY_STORE_KEY: ""
      ORACLE_OTP_REPLAY_KEY_PATH: email/otp_replay
      ORACLE_ALLOW_CREDENTIAL_PROVISIONING_ENDPOINT: "false"
      ORACLE_CREDENTIAL_PROVISIONING_TOKEN: ""
      # Release-bound identity for the disabled-by-default internal Human
      # Review notification route. The historical image remains non-activatable
      # for delivery until a fresh release supplies the complete reviewed lane.
      ORACLE_REVIEW_NOTIFICATION_CALLER_IDENTITY: tinker-delegate.review-operations
      ORACLE_REVIEW_NOTIFICATION_SMTP_PORT: "465"
      ORACLE_REVIEW_NOTIFICATION_SMTP_TIMEOUT_SECONDS: "10"
      ORACLE_REVIEW_NOTIFICATION_RECEIPT_STORE_PATH: /data/review_notification_receipts.json
      ORACLE_REVIEW_NOTIFICATION_RECEIPT_STORE_KEY: ""
      ORACLE_REVIEW_NOTIFICATION_RECEIPT_KEY_PATH: email/review_notification_receipts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      retries: 5
      timeout: 5s
      start_period: 180s

  # These two one-shot services are measured into the canonical main-CVM
  # descriptor but are absent from the initial service set. They may run only
  # under the separately reviewed account-genesis phase. The ordinary oracle
  # above keeps automatic genesis disabled, and the ordinary delegate below
  # keeps signup bootstrap disabled.
  mailbox-genesis:
    image: ghcr.io/g-structure/dnai-wikigen/tee-email-oracle@sha256:ac5d30a8150d840dcbef28f87444fa1916e99fc301c4287db281a9f0d3d48401
    platform: linux/amd64
    command: ["email-oracle", "genesis-profile"]
    profiles: ["mailbox-genesis"]
    restart: "no"
    ulimits:
      core: 0
    depends_on:
      neko:
        condition: service_healthy
    networks:
      - tee-net
    volumes:
      - oracle-data:/data
      - tinker-genesis-handoff:/handoff
      - mailbox-genesis-evidence:/evidence
      - tinker-account-genesis-evidence:/account-evidence:ro
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      ORACLE_CRED_STORE_PATH: /data/credentials.enc
      ORACLE_CRED_STORE_KEY: ""
      ORACLE_CDP_URL: http://neko:9222
      ORACLE_USE_BROWSER_FALLBACK: ${ORACLE_USE_BROWSER_FALLBACK:-true}
      ORACLE_AUTO_GENESIS: "false"
      ORACLE_COCKLI_DOMAIN: ${ORACLE_DOMAIN:-cock.email}
      ORACLE_API_HOST: 0.0.0.0
      ORACLE_API_PORT: "8000"
      ORACLE_PRODUCTION_RELEASE: "false"
      ORACLE_DSTACK_ENABLED: "true"
      ORACLE_DSTACK_KEY_PATH: email/creds
      ORACLE_RUNTIME_AUTH_REQUIRED: "true"
      ORACLE_RUNTIME_AUTH_TOKEN: ""
      ORACLE_RUNTIME_AUTH_KEY_PATH: oracle/runtime-auth
      ORACLE_AUTH_REQUIRED: "false"
      ORACLE_ALLOW_CREDENTIAL_PROVISIONING_ENDPOINT: "false"
      ORACLE_CREDENTIAL_PROVISIONING_TOKEN: ""
      ORACLE_OTP_REPLAY_STORE_PATH: /data/genesis_otp_replay.enc
      ORACLE_OTP_REPLAY_STORE_KEY: ""
      ORACLE_OTP_REPLAY_KEY_PATH: email/genesis_otp_replay
      ORACLE_GENESIS_EVIDENCE_DIRECTORY: /evidence/mailbox-genesis
      ORACLE_GENESIS_HANDOFF_PATH: /handoff/mailbox-genesis/signup-mailbox.enc
      ORACLE_GENESIS_ACCOUNT_RETIREMENT_PATH: /account-evidence/tinker-account-genesis/retirement.json
      ORACLE_GENESIS_ACCOUNT_TIMEOUT_SECONDS: "900"
      ORACLE_GENESIS_RELEASE_SHA: ""
      ORACLE_GENESIS_DEPLOYMENT_INTENT_SHA256: ""
      ORACLE_GENESIS_AUTHORIZATION_SHA256: ${TINKER_ACCOUNT_GENESIS_AUTHORIZATION_SHA256:-}
      ORACLE_GENESIS_MAIN_QVL_VERDICT_SHA256: ${TINKER_ACCOUNT_GENESIS_MAIN_QVL_VERDICT_SHA256:-}
      ORACLE_GENESIS_MEASUREMENT_POLICY_SHA256: ${TINKER_ACCOUNT_GENESIS_MEASUREMENT_POLICY_SHA256:-}
      ORACLE_GENESIS_MAIN_RUNTIME_CVM_ID: ${TINKER_COMPUTE_WORKLOAD_CVM_ID:?Canonical main runtime CVM ID required}
      ORACLE_GENESIS_MAIN_APP_ID: ${EMAIL_ORACLE_CONSUMER_APP_ID:?Release-bound main CVM TEE identity required}
      ORACLE_GENESIS_MAIN_COMPOSE_HASH: ${EMAIL_ORACLE_CONSUMER_COMPOSE_HASH:?Release-bound main CVM compose hash required}
      ORACLE_GENESIS_MAIN_OS_IMAGE_HASH: ${TINKER_DILIGENCE_ALLOWED_OS_IMAGE_HASH:?Release-bound main CVM OS image hash required}
      ORACLE_GENESIS_BINDING_CEREMONY_RECEIPT_SHA256: ""
      ORACLE_GENESIS_ACCOUNT_BINDING_COMMITMENT: ""
      ORACLE_GENESIS_REVIEWER_GENESIS_ACCEPTANCE_SHA256: ""
      ORACLE_GENESIS_REVIEWER_CURRENT_STATUS_EPOCH: ""
      ORACLE_GENESIS_REVIEWER_CURRENT_STATUS_SHA256: ""
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      retries: 120
      timeout: 3s
      start_period: 15s

  tinker-account-genesis:
    image: ghcr.io/g-structure/dnai-wikigen/tinker-delegate@sha256:262938c3620a2c4931b7ff0e5da1f321e564e2deade4550bd41104a3885f0b98
    platform: linux/amd64
    command: ["python", "-m", "tinker_delegate.account_genesis_profile"]
    profiles: ["tinker-account-genesis"]
    restart: "no"
    ulimits:
      core: 0
    depends_on:
      mailbox-genesis:
        condition: service_healthy
    networks:
      - tee-net
    volumes:
      - delegate-data:/data
      - tinker-genesis-handoff:/handoff:ro
      - tinker-account-genesis-evidence:/evidence
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      TINKER_BROWSER_WS_ENDPOINT: ""
      TINKER_CDP_URL: http://neko:9222
      TINKER_ORACLE_URL: http://mailbox-genesis:8000
      TINKER_ORACLE_AUTH_KEY_PATH: oracle/runtime-auth
      TINKER_API_KEY_STORE_PATH: /data/tinker_api_key.enc
      TINKER_DSTACK_KEY_PATH: tinker/api_key
      TINKER_BOOTSTRAP_SIGNUP: "false"
      TINKER_BOOTSTRAP_FAIL_OPEN: "false"
      TINKER_LOCAL_BROWSER_FALLBACK: "false"
      TINKER_ACCOUNT_GENESIS_HANDOFF_PATH: /handoff/mailbox-genesis/signup-mailbox.enc
      TINKER_ACCOUNT_GENESIS_EVIDENCE_DIRECTORY: /evidence/tinker-account-genesis
      TINKER_ACCOUNT_BINDING_SHARE_ONE: ${TINKER_ACCOUNT_BINDING_SHARE_ONE:-}
      TINKER_ACCOUNT_BINDING_SHARE_TWO: ${TINKER_ACCOUNT_BINDING_SHARE_TWO:-}
      # The release renderer replaces this inert source-template value with the
      # exact deployment-intent constructor commitment. It is never a mutable
      # post-measurement input.
      TINKER_ACCOUNT_BINDING_EXPECTED_COMMITMENT: ""
      TINKER_ACCOUNT_GENESIS_RELEASE_SHA: ""
      TINKER_ACCOUNT_GENESIS_DEPLOYMENT_INTENT_SHA256: ""
      TINKER_ACCOUNT_GENESIS_AUTHORIZATION_SHA256: ${TINKER_ACCOUNT_GENESIS_AUTHORIZATION_SHA256:-}
      TINKER_ACCOUNT_GENESIS_MAIN_QVL_VERDICT_SHA256: ${TINKER_ACCOUNT_GENESIS_MAIN_QVL_VERDICT_SHA256:-}
      TINKER_ACCOUNT_GENESIS_MEASUREMENT_POLICY_SHA256: ${TINKER_ACCOUNT_GENESIS_MEASUREMENT_POLICY_SHA256:-}
      TINKER_ACCOUNT_GENESIS_MAIN_RUNTIME_CVM_ID: ${TINKER_COMPUTE_WORKLOAD_CVM_ID:?Canonical main runtime CVM ID required}
      TINKER_ACCOUNT_GENESIS_MAIN_APP_ID: ${EMAIL_ORACLE_CONSUMER_APP_ID:?Release-bound main CVM TEE identity required}
      TINKER_ACCOUNT_GENESIS_MAIN_COMPOSE_HASH: ${EMAIL_ORACLE_CONSUMER_COMPOSE_HASH:?Release-bound main CVM compose hash required}
      TINKER_ACCOUNT_GENESIS_MAIN_OS_IMAGE_HASH: ${TINKER_DILIGENCE_ALLOWED_OS_IMAGE_HASH:?Release-bound main CVM OS image hash required}
      TINKER_ACCOUNT_GENESIS_BINDING_CEREMONY_RECEIPT_SHA256: ""
      TINKER_ACCOUNT_GENESIS_REVIEWER_GENESIS_ACCEPTANCE_SHA256: ""
      TINKER_ACCOUNT_GENESIS_REVIEWER_CURRENT_STATUS_EPOCH: ""
      TINKER_ACCOUNT_GENESIS_REVIEWER_CURRENT_STATUS_SHA256: ""
      DSTACK_ENABLED: "true"

  diligence-policy-init:
    image: ghcr.io/g-structure/dnai-wikigen/tinker-delegate@sha256:262938c3620a2c4931b7ff0e5da1f321e564e2deade4550bd41104a3885f0b98
    platform: linux/amd64
    command: ["tinker-diligence-evaluator-provision"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    volumes:
      - diligence-evaluator-policy:/sealed/diligence
    environment:
      TINKER_DILIGENCE_EVALUATOR_RELEASE_B64: ${TINKER_DILIGENCE_EVALUATOR_RELEASE_B64:?Canonical Diligence evaluator release manifest base64url required}
      TINKER_DILIGENCE_EVALUATOR_RELEASE_MANIFEST_PATH: ${TINKER_DILIGENCE_EVALUATOR_RELEASE_MANIFEST_PATH:?Reviewed Diligence evaluator release manifest path required}
      TINKER_DILIGENCE_EVALUATOR_RELEASE_MANIFEST_SHA256: ${TINKER_DILIGENCE_EVALUATOR_RELEASE_MANIFEST_SHA256:?Reviewed Diligence evaluator release manifest SHA-256 required}
      TINKER_DILIGENCE_EVALUATOR_POLICY_SET_ROOT: ${TINKER_DILIGENCE_EVALUATOR_POLICY_SET_ROOT:?Reviewed Diligence evaluator policy-set root required}

  # Networkless, fail-closed writer for the private release authority consumed
  # by the wallet-owned customer runtime. At bootstrap the exact disabled
  # marker makes this a no-write success. The reviewed final environment
  # recreates it with canonical encrypted authority bytes and their digest.
  tinker-customer-authority-init:
    image: ghcr.io/g-structure/dnai-wikigen/tinker-delegate@sha256:262938c3620a2c4931b7ff0e5da1f321e564e2deade4550bd41104a3885f0b98
    platform: linux/amd64
    command: ["tinker-customer-authority-init"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    volumes:
      - tinker-customer-authority:/sealed/tinker-customer
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      DSTACK_ENABLED: "true"
      DSTACK_SIMULATOR_ENDPOINT: ""
      TINKER_CUSTOMER_ENABLED: ${TINKER_CUSTOMER_ENABLED:-false}
      TINKER_CUSTOMER_AUTHORITY_B64: ${TINKER_CUSTOMER_AUTHORITY_B64:-}
      TINKER_CUSTOMER_AUTHORITY_PATH: /sealed/tinker-customer/authority.json
      TINKER_CUSTOMER_AUTHORITY_SHA256: ${TINKER_CUSTOMER_AUTHORITY_SHA256:-}
      TINKER_CUSTOMER_SETTLEMENT_SIGNING_KEY: ""
      TINKER_CUSTOMER_SETTLEMENT_KEY_PATH: tinker/customer_settlement_evidence

  delegate:
    image: ghcr.io/g-structure/dnai-wikigen/tinker-delegate@sha256:262938c3620a2c4931b7ff0e5da1f321e564e2deade4550bd41104a3885f0b98
    platform: linux/amd64
    restart: unless-stopped
    ulimits:
      core: 0
    depends_on:
      oracle:
        condition: service_started
      diligence-policy-init:
        condition: service_completed_successfully
      tinker-customer-authority-init:
        condition: service_completed_successfully
    networks:
      tee-net:
        ipv4_address: 172.20.0.5
    ports:
      - "8080:8080"
    volumes:
      - delegate-data:/data
      - diligence-evaluator-policy:/sealed/diligence:ro
      - tinker-customer-authority:/sealed/tinker-customer:ro
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      TINKER_BROWSER_WS_ENDPOINT: ""
      TINKER_CDP_URL: http://172.20.0.3:9222
      TINKER_ORACLE_URL: http://172.20.0.4:8000
      TINKER_ORACLE_AUTH_KEY_PATH: ${TINKER_ORACLE_AUTH_KEY_PATH:-oracle/runtime-auth}
      TINKER_RUNTIME_AUTH_REQUIRED: "true"
      TINKER_RUNTIME_AUTH_TOKEN: ${TINKER_RUNTIME_AUTH_TOKEN:-}
      TINKER_RUNTIME_AUTH_KEY_PATH: ${TINKER_RUNTIME_AUTH_KEY_PATH:-tinker/runtime-auth}
      TINKER_CORS_ALLOWED_ORIGINS: ${TINKER_CORS_ALLOWED_ORIGINS:-}
      TINKER_WALLET_AUTH_KEY_PATH: ${TINKER_WALLET_AUTH_KEY_PATH:-tinker/wallet_auth}
      TINKER_WALLET_AUTH_DOMAIN: www.wikigen.me
      TINKER_WALLET_AUTH_URI: https://www.wikigen.me
      TINKER_WALLET_AUTH_CHAIN_ID: "84532"
      TINKER_WALLET_AUTH_RPC_URL: ${TINKER_WALLET_AUTH_RPC_URL:?Trusted Base Sepolia wallet-auth HTTPS RPC URL required}
      TINKER_WALLET_AUTH_RPC_URL_SECONDARY: ${TINKER_WALLET_AUTH_RPC_URL_SECONDARY:?Independent secondary Base Sepolia wallet-auth HTTPS RPC URL required}
      TINKER_WALLET_AUTH_RPC_TIMEOUT_SECONDS: ${TINKER_WALLET_AUTH_RPC_TIMEOUT_SECONDS:-3.0}
      TINKER_WALLET_AUTH_RPC_MAX_RESPONSE_BYTES: ${TINKER_WALLET_AUTH_RPC_MAX_RESPONSE_BYTES:-131072}
      TINKER_WALLET_AUTH_MAX_SIGNATURE_BYTES: ${TINKER_WALLET_AUTH_MAX_SIGNATURE_BYTES:-4096}
      TINKER_WALLET_AUTH_CHALLENGE_LIMIT_WINDOW_SECONDS: ${TINKER_WALLET_AUTH_CHALLENGE_LIMIT_WINDOW_SECONDS:-600}
      TINKER_WALLET_AUTH_CHALLENGE_GLOBAL_LIMIT: ${TINKER_WALLET_AUTH_CHALLENGE_GLOBAL_LIMIT:-768}
      TINKER_WALLET_AUTH_CHALLENGE_ADDRESS_LIMIT: ${TINKER_WALLET_AUTH_CHALLENGE_ADDRESS_LIMIT:-64}
      TINKER_WALLET_AUTH_CHALLENGE_PEER_LIMIT: ${TINKER_WALLET_AUTH_CHALLENGE_PEER_LIMIT:-256}
      TINKER_WALLET_AUTH_CHALLENGE_TRUSTED_PROXY_CIDRS: ${TINKER_WALLET_AUTH_CHALLENGE_TRUSTED_PROXY_CIDRS:-}
      TINKER_WALLET_AUTH_CHALLENGE_CLIENT_IP_HEADER: ${TINKER_WALLET_AUTH_CHALLENGE_CLIENT_IP_HEADER:-}
      TINKER_COLLABORATION_ENABLED: ${TINKER_COLLABORATION_ENABLED:-false}
      TINKER_COLLABORATION_WALLET_AUTH_SIGNING_KEY: ""
      TINKER_COLLABORATION_WALLET_AUTH_KEY_PATH: tinker/collaboration_wallet_auth
      TINKER_COLLABORATION_WALLET_AUTH_CHALLENGE_TTL_SECONDS: "300"
      TINKER_COLLABORATION_WALLET_AUTH_TOKEN_TTL_SECONDS: "600"
      TINKER_COLLABORATION_WALLET_AUTH_MAX_PENDING_CHALLENGES: "1024"
      TINKER_COLLABORATION_WALLET_AUTH_ISSUER: dnai-wikigen:collaboration-wallet-auth
      TINKER_COLLABORATION_WALLET_AUTH_AUDIENCE: dnai-wikigen:collaboration-console
      TINKER_COLLABORATION_CONSENT_CHALLENGE_TTL_SECONDS: "300"
      TINKER_COLLABORATION_STORE_PATH: /data/collaboration_state.json
      TINKER_COLLABORATION_STORE_INTEGRITY_KEY: ""
      TINKER_COLLABORATION_STORE_INTEGRITY_KEY_PATH: tinker/collaboration_store_integrity
      TINKER_COLLABORATION_EXECUTION_ENABLED: ${TINKER_COLLABORATION_EXECUTION_ENABLED:-false}
      TINKER_COLLABORATION_EXECUTION_JOURNAL_PATH: /data/collaboration_execution.json
      TINKER_COLLABORATION_EXECUTION_JOURNAL_INTEGRITY_KEY: ""
      TINKER_COLLABORATION_EXECUTION_JOURNAL_INTEGRITY_KEY_PATH: tinker/collaboration_execution_journal_integrity
      TINKER_COLLABORATION_ROYALTY_SETTLEMENT_STORE_PATH: /data/collaboration_royalty_settlement.json
      TINKER_COLLABORATION_ROYALTY_SETTLEMENT_STORE_INTEGRITY_KEY: ""
      TINKER_COLLABORATION_ROYALTY_SETTLEMENT_STORE_INTEGRITY_KEY_PATH: tinker/collaboration_royalty_settlement_store
      TINKER_COLLABORATION_EXECUTION_WORKER_HEARTBEAT_PATH: /data/collaboration_execution_worker_heartbeat.json
      TINKER_COLLABORATION_EXECUTION_WORKER_HEARTBEAT_INTEGRITY_KEY: ""
