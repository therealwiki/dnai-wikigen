###############################################################################
# Tinker Delegate — Local dev compose
#
# Requires tee-email-oracle services running (neko + oracle):
#   cd ⚙️/tee-email-oracle && docker compose --profile browser up -d
#
# Then:
#   docker compose up -d
#
# API:
#   curl http://localhost:8080/health
#   curl http://localhost:8080/billing/balance
###############################################################################

services:
  delegate:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    ulimits:
      core: 0
    ports:
      - "8080:8080"
    volumes:
      - delegate-data:/data
    environment:
      TINKER_CDP_URL: ${TINKER_CDP_URL:-http://host.docker.internal:9222}
      TINKER_ORACLE_URL: ${TINKER_ORACLE_URL:-http://host.docker.internal:8000}
      TINKER_RUNTIME_AUTH_REQUIRED: ${TINKER_RUNTIME_AUTH_REQUIRED:-true}
      TINKER_RUNTIME_AUTH_TOKEN: ${TINKER_RUNTIME_AUTH_TOKEN:-}
      TINKER_RUNTIME_AUTH_KEY_PATH: ${TINKER_RUNTIME_AUTH_KEY_PATH:-tinker/runtime-auth}
      TINKER_CORS_ALLOWED_ORIGINS: ${TINKER_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5175,http://localhost:5175}
      TINKER_WALLET_AUTH_SIGNING_KEY: ${TINKER_WALLET_AUTH_SIGNING_KEY:-}
      TINKER_WALLET_AUTH_KEY_PATH: ${TINKER_WALLET_AUTH_KEY_PATH:-tinker/wallet_auth}
      TINKER_WALLET_AUTH_DOMAIN: ${TINKER_WALLET_AUTH_DOMAIN:-www.wikigen.me}
      TINKER_WALLET_AUTH_URI: ${TINKER_WALLET_AUTH_URI:-https://www.wikigen.me}
      TINKER_WALLET_AUTH_CHAIN_ID: ${TINKER_WALLET_AUTH_CHAIN_ID:-84532}
      TINKER_WALLET_AUTH_RPC_URL: ${TINKER_WALLET_AUTH_RPC_URL:-}
      TINKER_WALLET_AUTH_RPC_URL_SECONDARY: ${TINKER_WALLET_AUTH_RPC_URL_SECONDARY:-}
      TINKER_WALLET_AUTH_RPC_TIMEOUT_SECONDS: ${TINKER_WALLET_AUTH_RPC_TIMEOUT_SECONDS:-3.0}
      TINKER_WALLET_AUTH_RPC_MAX_RESPONSE_BYTES: ${TINKER_WALLET_AUTH_RPC_MAX_RESPONSE_BYTES:-131072}
      TINKER_WALLET_AUTH_MAX_SIGNATURE_BYTES: ${TINKER_WALLET_AUTH_MAX_SIGNATURE_BYTES:-4096}
      TINKER_WALLET_AUTH_CHALLENGE_LIMIT_WINDOW_SECONDS: ${TINKER_WALLET_AUTH_CHALLENGE_LIMIT_WINDOW_SECONDS:-600}
      TINKER_WALLET_AUTH_CHALLENGE_GLOBAL_LIMIT: ${TINKER_WALLET_AUTH_CHALLENGE_GLOBAL_LIMIT:-768}
      TINKER_WALLET_AUTH_CHALLENGE_ADDRESS_LIMIT: ${TINKER_WALLET_AUTH_CHALLENGE_ADDRESS_LIMIT:-64}
      TINKER_WALLET_AUTH_CHALLENGE_PEER_LIMIT: ${TINKER_WALLET_AUTH_CHALLENGE_PEER_LIMIT:-256}
      TINKER_WALLET_AUTH_CHALLENGE_TRUSTED_PROXY_CIDRS: ${TINKER_WALLET_AUTH_CHALLENGE_TRUSTED_PROXY_CIDRS:-}
      TINKER_WALLET_AUTH_CHALLENGE_CLIENT_IP_HEADER: ${TINKER_WALLET_AUTH_CHALLENGE_CLIENT_IP_HEADER:-}
      TINKER_ARENA_WALLET_AUTH_KEY_PATH: ${TINKER_ARENA_WALLET_AUTH_KEY_PATH:-tinker/arena_wallet_auth}
      TINKER_ARENA_WALLET_AUTH_CHALLENGE_TTL_SECONDS: ${TINKER_ARENA_WALLET_AUTH_CHALLENGE_TTL_SECONDS:-300}
      TINKER_ARENA_WALLET_AUTH_TOKEN_TTL_SECONDS: ${TINKER_ARENA_WALLET_AUTH_TOKEN_TTL_SECONDS:-300}
      TINKER_ARENA_WALLET_AUTH_MAX_PENDING_CHALLENGES: ${TINKER_ARENA_WALLET_AUTH_MAX_PENDING_CHALLENGES:-1024}
      TINKER_ARENA_REGISTRY_RPC_URL: ${TINKER_ARENA_REGISTRY_RPC_URL:-}
      TINKER_ARENA_REGISTRY_ADDRESS: ${TINKER_ARENA_REGISTRY_ADDRESS:-}
      TINKER_ARENA_REGISTRY_RUNTIME_CODE_HASH: ${TINKER_ARENA_REGISTRY_RUNTIME_CODE_HASH:-}
      TINKER_ARENA_REGISTRY_APPROVED_CHALLENGE_BINDINGS_JSON: ${TINKER_ARENA_REGISTRY_APPROVED_CHALLENGE_BINDINGS_JSON:-}
      TINKER_ARENA_REGISTRY_APPROVED_CHALLENGE_SET_SHA256: ${TINKER_ARENA_REGISTRY_APPROVED_CHALLENGE_SET_SHA256:-}
      TINKER_ARENA_REGISTRY_MAX_BLOCK_AGE_SECONDS: ${TINKER_ARENA_REGISTRY_MAX_BLOCK_AGE_SECONDS:-300}
      TINKER_ARENA_REGISTRY_MAX_FUTURE_BLOCK_SKEW_SECONDS: ${TINKER_ARENA_REGISTRY_MAX_FUTURE_BLOCK_SKEW_SECONDS:-30}
      TINKER_ARENA_STORE_PATH: ${TINKER_ARENA_STORE_PATH:-/data/arena_state.json}
      TINKER_ARENA_CANDIDATE_INGRESS_STORE_PATH: ${TINKER_ARENA_CANDIDATE_INGRESS_STORE_PATH:-/data/arena_candidates}
      TINKER_ARENA_CANDIDATE_INGRESS_KEY_PATH: ${TINKER_ARENA_CANDIDATE_INGRESS_KEY_PATH:-tinker/arena_candidate_ingress}
      TINKER_ARENA_CANDIDATE_INGRESS_LOCAL_KEY_FILE: ${TINKER_ARENA_CANDIDATE_INGRESS_LOCAL_KEY_FILE:-/data/arena_candidate_ingress.key}
      TINKER_ARENA_CANDIDATE_INGRESS_MAX_ENVELOPES: ${TINKER_ARENA_CANDIDATE_INGRESS_MAX_ENVELOPES:-10000}
      TINKER_COMPUTE_WALLET_AUTH_SIGNING_KEY: ${TINKER_COMPUTE_WALLET_AUTH_SIGNING_KEY:-}
      TINKER_COMPUTE_WALLET_AUTH_KEY_PATH: ${TINKER_COMPUTE_WALLET_AUTH_KEY_PATH:-tinker/compute_wallet_auth}
      TINKER_COMPUTE_CREDENTIAL_SIGNING_KEY: ${TINKER_COMPUTE_CREDENTIAL_SIGNING_KEY:-}
      TINKER_COMPUTE_CREDENTIAL_KEY_PATH: ${TINKER_COMPUTE_CREDENTIAL_KEY_PATH:-tinker/compute_credentials}
      TINKER_COMPUTE_STORE_PATH: ${TINKER_COMPUTE_STORE_PATH:-/data/compute_console_state.json}
      TINKER_COMPUTE_STORE_INTEGRITY_KEY: ${TINKER_COMPUTE_STORE_INTEGRITY_KEY:-}
      TINKER_COMPUTE_STORE_INTEGRITY_KEY_PATH: ${TINKER_COMPUTE_STORE_INTEGRITY_KEY_PATH:-tinker/compute_store_integrity}
      TINKER_EXECUTION_POLICY_STORE_PATH: ${TINKER_EXECUTION_POLICY_STORE_PATH:-/data/execution_policy_state.json}
      TINKER_EXECUTION_POLICY_STORE_INTEGRITY_KEY: ${TINKER_EXECUTION_POLICY_STORE_INTEGRITY_KEY:-}
      TINKER_EXECUTION_POLICY_STORE_INTEGRITY_KEY_PATH: ${TINKER_EXECUTION_POLICY_STORE_INTEGRITY_KEY_PATH:-tinker/execution_policy_store_integrity}
      TINKER_EXECUTION_POLICY_APPROVED_SIGNERS: ${TINKER_EXECUTION_POLICY_APPROVED_SIGNERS:-}
      TINKER_EXECUTION_POLICY_APPROVER_ROOT_HASH: ${TINKER_EXECUTION_POLICY_APPROVER_ROOT_HASH:-}
      TINKER_EXECUTION_POLICY_APPROVAL_DOMAIN: ${TINKER_EXECUTION_POLICY_APPROVAL_DOMAIN:-}
      TINKER_EXECUTION_POLICY_ANCHOR_RPC_URL: ${TINKER_EXECUTION_POLICY_ANCHOR_RPC_URL:-}
      TINKER_EXECUTION_POLICY_ANCHOR_ADDRESS: ${TINKER_EXECUTION_POLICY_ANCHOR_ADDRESS:-}
      TINKER_EXECUTION_POLICY_ANCHOR_RUNTIME_CODE_HASH: ${TINKER_EXECUTION_POLICY_ANCHOR_RUNTIME_CODE_HASH:-}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_ADDRESS: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_ADDRESS:-}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_RELEASE_COMMITMENT: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_RELEASE_COMMITMENT:-}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_KEY_PATH: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_KEY_PATH:-tinker/execution_policy_anchor_writer}
      TINKER_EXECUTION_POLICY_ANCHOR_CONFIRMATIONS: ${TINKER_EXECUTION_POLICY_ANCHOR_CONFIRMATIONS:-12}
      TINKER_EXECUTION_POLICY_ANCHOR_POLL_INTERVAL_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_POLL_INTERVAL_SECONDS:-1}
      TINKER_EXECUTION_POLICY_ANCHOR_CONFIRMATION_WAIT_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_CONFIRMATION_WAIT_SECONDS:-60}
      TINKER_EXECUTION_POLICY_ANCHOR_MAX_BLOCK_AGE_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_MAX_BLOCK_AGE_SECONDS:-3600}
      TINKER_EXECUTION_POLICY_ANCHOR_MAX_FUTURE_BLOCK_SKEW_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_MAX_FUTURE_BLOCK_SKEW_SECONDS:-30}
      TINKER_FUNDING_PREFLIGHT_ALLOWED_HOSTS: ${TINKER_FUNDING_PREFLIGHT_ALLOWED_HOSTS:-}
      TINKER_API_KEY_STORE_PATH: /data/tinker_api_key.enc
      TINKER_BROWSER_SESSION_STORE_PATH: /data/browser_session.enc
      TINKER_FUNDING_RECEIPT_STORE_PATH: /data/funding_receipts.enc
      TINKER_RUN_METADATA_STORE_PATH: /data/run_metadata.enc
      TINKER_FUNDING_MODE: ${TINKER_FUNDING_MODE:-manual_prefund}
      TINKER_MIN_ADD_BALANCE_USD: ${TINKER_MIN_ADD_BALANCE_USD:-10.0}
      TINKER_MAX_ADD_BALANCE_USD: ${TINKER_MAX_ADD_BALANCE_USD:-10.0}
      TINKER_ALLOW_ADD_BALANCE_ENDPOINT: ${TINKER_ALLOW_ADD_BALANCE_ENDPOINT:-false}
      TINKER_BOOTSTRAP_SIGNUP: ${TINKER_BOOTSTRAP_SIGNUP:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  delegate-data:
