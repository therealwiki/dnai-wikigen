[project]
name = "tinker-delegate"
version = "0.1.0"
description = "Automate Thinking Machines Tinker account signup and delegation inside TEE"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "cryptography>=44.0",
    "dstack-sdk>=0.5.2",
    "eth-hash[pycryptodome]>=0.7.0",
    "eth-account>=0.13.7",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
agent = [
    # Thinking Machines SDK (for IsolatedTinkerSession + evaluator).
    # Pinned to >=0.22: the Tinker server rejects older SDKs with a 400
    # "Your Tinker SDK version is no longer supported" (the deployed CVM image
    # shipped 0.15.0, which is why the live smoke failed at ServiceClient
    # creation). Rebuild the CVM image to pick up a supported SDK.
    "tinker>=0.22",
]

[project.scripts]
tinker-delegate = "tinker_delegate.main:cli"
tinker-deal-runtime = "tinker_delegate.deal_runtime:main"
tinker-arena-worker = "tinker_delegate.arena_worker_cli:main"
tinker-arena-provision = "tinker_delegate.arena_policy_provisioner:main"
tinker-diligence-evaluator-provision = "tinker_delegate.diligence_evaluator_provisioner:main"
tinker-diligence-evaluator-release = "tinker_delegate.diligence_evaluator_release_builder:main"
tinker-compute-runtime = "tinker_delegate.compute_runtime_cli:main"
tinker-execution-policy-anchor-writer = "tinker_delegate.execution_policy_anchor_cli:main"
tinker-release-composes = "tinker_delegate.release_composes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "dcap-qvl==0.5.2",
    "pytest==9.0.2",
]
