###############################################################################
# Tinker Delegate — dstack / Phala Cloud overlay
#
# Deploy alongside tee-email-oracle in the same CVM:
#   Merge both compose files for the CVM deployment.
#
# This overlay:
#   - Connects to neko Chrome + email oracle on the CVM internal network
#   - Mounts dstack.sock for TDX attestation + KMS key derivation
#   - Enables dstack mode for real attestation quotes
#   - Exposes an explicit one-shot profile for independently verified writer evidence
#   - Provisions authenticated Arena policy with no network before the worker
#   - Runs one internal-only safe-IR Arena worker from the same source/image
###############################################################################

services:
  diligence-policy-init:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    command: ["tinker-diligence-evaluator-provision"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    volumes:
      - diligence-evaluator-policy:/sealed/diligence
    environment:
      TINKER_DILIGENCE_EVALUATOR_RELEASE_B64: ${TINKER_DILIGENCE_EVALUATOR_RELEASE_B64:?Canonical Diligence evaluator release manifest base64url required}
      TINKER_DILIGENCE_EVALUATOR_RELEASE_MANIFEST_PATH: ${TINKER_DILIGENCE_EVALUATOR_RELEASE_MANIFEST_PATH:?Reviewed Diligence evaluator release manifest path required}
      TINKER_DILIGENCE_EVALUATOR_RELEASE_MANIFEST_SHA256: ${TINKER_DILIGENCE_EVALUATOR_RELEASE_MANIFEST_SHA256:?Reviewed Diligence evaluator release manifest SHA-256 required}
      TINKER_DILIGENCE_EVALUATOR_POLICY_SET_ROOT: ${TINKER_DILIGENCE_EVALUATOR_POLICY_SET_ROOT:?Reviewed Diligence evaluator policy-set root required}

  delegate:
    depends_on:
      diligence-policy-init:
        condition: service_completed_successfully
    environment:
      TINKER_CDP_URL: http://172.30.0.3:9222
      TINKER_ORACLE_URL: http://oracle:8000
      TINKER_RUNTIME_AUTH_REQUIRED: "true"
      TINKER_RUNTIME_AUTH_TOKEN: ${TINKER_RUNTIME_AUTH_TOKEN:-}
      TINKER_RUNTIME_AUTH_KEY_PATH: ${TINKER_RUNTIME_AUTH_KEY_PATH:-tinker/runtime-auth}
      TINKER_CORS_ALLOWED_ORIGINS: ${TINKER_CORS_ALLOWED_ORIGINS:-}
      TINKER_WALLET_AUTH_SIGNING_KEY: ""
      TINKER_WALLET_AUTH_KEY_PATH: ${TINKER_WALLET_AUTH_KEY_PATH:-tinker/wallet_auth}
      TINKER_WALLET_AUTH_DOMAIN: ${TINKER_WALLET_AUTH_DOMAIN:-www.wikigen.me}
      TINKER_WALLET_AUTH_URI: ${TINKER_WALLET_AUTH_URI:-https://www.wikigen.me}
      TINKER_WALLET_AUTH_CHAIN_ID: ${TINKER_WALLET_AUTH_CHAIN_ID:-84532}
      TINKER_WALLET_AUTH_RPC_URL: ${TINKER_WALLET_AUTH_RPC_URL:?Trusted Base Sepolia wallet-auth HTTPS RPC URL required}
      TINKER_WALLET_AUTH_RPC_URL_SECONDARY: ${TINKER_WALLET_AUTH_RPC_URL_SECONDARY:?Independent secondary Base Sepolia wallet-auth HTTPS RPC URL required}
      TINKER_WALLET_AUTH_RPC_TIMEOUT_SECONDS: ${TINKER_WALLET_AUTH_RPC_TIMEOUT_SECONDS:-3.0}
      TINKER_WALLET_AUTH_RPC_MAX_RESPONSE_BYTES: ${TINKER_WALLET_AUTH_RPC_MAX_RESPONSE_BYTES:-131072}
      TINKER_WALLET_AUTH_MAX_SIGNATURE_BYTES: ${TINKER_WALLET_AUTH_MAX_SIGNATURE_BYTES:-4096}
      TINKER_WALLET_AUTH_CHALLENGE_LIMIT_WINDOW_SECONDS: ${TINKER_WALLET_AUTH_CHALLENGE_LIMIT_WINDOW_SECONDS:-600}
      TINKER_WALLET_AUTH_CHALLENGE_GLOBAL_LIMIT: ${TINKER_WALLET_AUTH_CHALLENGE_GLOBAL_LIMIT:-768}
      TINKER_WALLET_AUTH_CHALLENGE_ADDRESS_LIMIT: ${TINKER_WALLET_AUTH_CHALLENGE_ADDRESS_LIMIT:-64}
      TINKER_WALLET_AUTH_CHALLENGE_PEER_LIMIT: ${TINKER_WALLET_AUTH_CHALLENGE_PEER_LIMIT:-256}
      TINKER_WALLET_AUTH_CHALLENGE_TRUSTED_PROXY_CIDRS: ${TINKER_WALLET_AUTH_CHALLENGE_TRUSTED_PROXY_CIDRS:-}
      TINKER_WALLET_AUTH_CHALLENGE_CLIENT_IP_HEADER: ${TINKER_WALLET_AUTH_CHALLENGE_CLIENT_IP_HEADER:-}
      TINKER_ARENA_WALLET_AUTH_KEY_PATH: ${TINKER_ARENA_WALLET_AUTH_KEY_PATH:-tinker/arena_wallet_auth}
      # ChallengeRegistry authority is inherited from the base descriptor;
      # this overlay creates no parallel operator-supplied registry policy.
      TINKER_ARENA_STORE_PATH: ${TINKER_ARENA_STORE_PATH:-/data/arena_state.json}
      TINKER_ARENA_CANDIDATE_INGRESS_STORE_PATH: ${TINKER_ARENA_CANDIDATE_INGRESS_STORE_PATH:-/data/arena_candidates}
      TINKER_ARENA_CANDIDATE_INGRESS_KEY_PATH: ${TINKER_ARENA_CANDIDATE_INGRESS_KEY_PATH:-tinker/arena_candidate_ingress}
      TINKER_ARENA_CANDIDATE_INGRESS_LOCAL_KEY_FILE: ""
      # The public capability still fails closed on an exact, fresh,
      # dstack-keyed heartbeat; the release descriptor owns the enable bit.
      TINKER_ARENA_WORKER_LIVE_CAPABILITY_ENABLED: "true"
      TINKER_ARENA_WORKER_RELEASE_SHA: ${TINKER_ARENA_WORKER_RELEASE_SHA:-}
      TINKER_ARENA_WORKER_IMAGE_DIGEST: ${TINKER_ARENA_WORKER_IMAGE_DIGEST:-}
      TINKER_ARENA_WORKER_RELEASE_MANIFEST_SHA256: ${TINKER_ARENA_WORKER_RELEASE_MANIFEST_SHA256:-}
      TINKER_ARENA_WORKER_APPROVED_CHALLENGE_SET_SHA256: ${TINKER_ARENA_REGISTRY_APPROVED_CHALLENGE_SET_SHA256:?Authorized ChallengeRegistry challenge-set digest required}
      TINKER_ARENA_WORKER_RELEASE_POLICY_COMMITMENT: ${TINKER_ARENA_WORKER_RELEASE_POLICY_COMMITMENT:-}
      TINKER_ARENA_WORKER_COMPOSE_HASH: ${TINKER_ARENA_WORKER_COMPOSE_HASH:-}
      TINKER_ARENA_WORKER_APP_ID: ${TINKER_ARENA_WORKER_APP_ID:-}
      TINKER_ARENA_WORKER_OS_IMAGE_HASH: ${TINKER_ARENA_WORKER_OS_IMAGE_HASH:-}
      TINKER_ARENA_WORKER_HEARTBEAT_PATH: /data/arena_worker_heartbeat.json
      TINKER_ARENA_WORKER_HEARTBEAT_TTL_SECONDS: ${TINKER_ARENA_WORKER_HEARTBEAT_TTL_SECONDS:-30}
      TINKER_ARENA_WORKER_HEARTBEAT_KEY_PATH: ${TINKER_ARENA_WORKER_HEARTBEAT_KEY_PATH:-tinker/arena_worker_heartbeat}
      TINKER_ARENA_WORKER_HEARTBEAT_INTEGRITY_KEY: ""
      TINKER_COMPUTE_WALLET_AUTH_SIGNING_KEY: ""
      TINKER_COMPUTE_WALLET_AUTH_KEY_PATH: ${TINKER_COMPUTE_WALLET_AUTH_KEY_PATH:-tinker/compute_wallet_auth}
      TINKER_COMPUTE_CREDENTIAL_SIGNING_KEY: ""
      TINKER_COMPUTE_CREDENTIAL_KEY_PATH: ${TINKER_COMPUTE_CREDENTIAL_KEY_PATH:-tinker/compute_credentials}
      TINKER_COMPUTE_STORE_PATH: ${TINKER_COMPUTE_STORE_PATH:-/data/compute_console_state.json}
      TINKER_COMPUTE_STORE_INTEGRITY_KEY: ""
      TINKER_COMPUTE_STORE_INTEGRITY_KEY_PATH: ${TINKER_COMPUTE_STORE_INTEGRITY_KEY_PATH:-tinker/compute_store_integrity}
      TINKER_COMPUTE_WORKLOAD_INGRESS_STORE_PATH: /data/compute_workload_ingress
      TINKER_COMPUTE_WORKLOAD_INGRESS_INTEGRITY_KEY: ""
      TINKER_COMPUTE_WORKLOAD_INGRESS_INTEGRITY_KEY_PATH: tinker/compute_workload_ingress_integrity
      TINKER_COMPUTE_WORKLOAD_INGRESS_KEY_PATH: tinker/compute_workload_ingress
      TINKER_COMPUTE_WORKLOAD_INGRESS_LOCAL_KEY_FILE: ""
      TINKER_COMPUTE_WORKLOAD_INGRESS_PRIVATE_KEY_HEX: ""
      TINKER_COMPUTE_WORKLOAD_QVL_URL: ${TINKER_COMPUTE_WORKLOAD_QVL_URL:?Dedicated Compute workload QVL HTTPS /verify URL required}
      TINKER_COMPUTE_WORKLOAD_QVL_AUTH_TOKEN: ${TINKER_COMPUTE_WORKLOAD_QVL_AUTH_TOKEN:?Dedicated Compute workload QVL bearer required}
      TINKER_COMPUTE_WORKLOAD_QVL_VERIFIER_ADDRESS: ${TINKER_COMPUTE_WORKLOAD_QVL_VERIFIER_ADDRESS:?Dedicated Compute workload QVL verifier required}
      TINKER_COMPUTE_WORKLOAD_QVL_RELEASE_POLICY_HASH: ${TINKER_COMPUTE_WORKLOAD_QVL_RELEASE_POLICY_HASH:?Dedicated Compute workload QVL release policy required}
      TINKER_COMPUTE_WORKLOAD_QVL_MAX_VERDICT_AGE_SECONDS: ${TINKER_COMPUTE_WORKLOAD_QVL_MAX_VERDICT_AGE_SECONDS:?Compute workload QVL age bound required}
      TINKER_COMPUTE_WORKLOAD_QVL_REVOKED_QUOTE_HASHES_JSON: ${TINKER_COMPUTE_WORKLOAD_QVL_REVOKED_QUOTE_HASHES_JSON:?Compute workload quote revocations required}
      TINKER_COMPUTE_WORKLOAD_CHAIN_ID: "84532"
      TINKER_COMPUTE_VAULT_ADDRESS: ${TINKER_COMPUTE_VAULT_ADDRESS:?Fresh ComputeCreditVault address required}
      TINKER_COMPUTE_VAULT_RUNTIME_CODE_HASH: ${TINKER_COMPUTE_VAULT_RUNTIME_CODE_HASH:?Fresh ComputeCreditVault runtime code hash required}
      TINKER_COMPUTE_WORKLOAD_FRESH_DEPLOYMENT_RECEIPT_SHA256: ${TINKER_COMPUTE_WORKLOAD_FRESH_DEPLOYMENT_RECEIPT_SHA256:?Fresh contract deployment receipt SHA-256 required}
      TINKER_COMPUTE_WORKLOAD_CVM_ID: ${TINKER_COMPUTE_WORKLOAD_CVM_ID:?Canonical main runtime CVM ID required}
      TINKER_COMPUTE_WORKLOAD_DEPLOYMENT_INTENT_SHA256: ${TINKER_COMPUTE_WORKLOAD_DEPLOYMENT_INTENT_SHA256:?Signed seven-CVM deployment intent required}
      TINKER_COMPUTE_WORKLOAD_RELEASE_AUTHORITY_SHA256: ${TINKER_COMPUTE_WORKLOAD_RELEASE_AUTHORITY_SHA256:-}
      TINKER_COMPUTE_WORKLOAD_CEREMONY_NONCE: ${TINKER_COMPUTE_WORKLOAD_CEREMONY_NONCE:?Release ceremony nonce required}
      TINKER_COMPUTE_WORKLOAD_MEASUREMENT_POLICY_SET_SHA256: ${TINKER_COMPUTE_WORKLOAD_MEASUREMENT_POLICY_SET_SHA256:?Signed QVL measurement-policy set required}
      TINKER_COMPUTE_WORKLOAD_QVL_MEASUREMENT_POLICY_SHA256: ${TINKER_COMPUTE_WORKLOAD_QVL_MEASUREMENT_POLICY_SHA256:?Linked Compute-workload QVL measurement policy required}
      TINKER_COMPUTE_WORKLOAD_MAIN_RUNTIME_EVIDENCE_SHA256: ${TINKER_COMPUTE_WORKLOAD_MAIN_RUNTIME_EVIDENCE_SHA256:-}
      TINKER_COMPUTE_DISPATCH_STORE_PATH: ${TINKER_COMPUTE_DISPATCH_STORE_PATH:-/data/compute_exact_asset_dispatch.json}
      TINKER_COMPUTE_DISPATCH_STORE_INTEGRITY_KEY: ""
      TINKER_COMPUTE_DISPATCH_STORE_INTEGRITY_KEY_PATH: ${TINKER_COMPUTE_DISPATCH_STORE_INTEGRITY_KEY_PATH:-tinker/compute_dispatch_store_integrity}
      TINKER_EXECUTION_POLICY_STORE_PATH: ${TINKER_EXECUTION_POLICY_STORE_PATH:-/data/execution_policy_state.json}
      TINKER_EXECUTION_POLICY_STORE_INTEGRITY_KEY: ""
      TINKER_EXECUTION_POLICY_STORE_INTEGRITY_KEY_PATH: ${TINKER_EXECUTION_POLICY_STORE_INTEGRITY_KEY_PATH:-tinker/execution_policy_store_integrity}
      TINKER_EXECUTION_POLICY_APPROVED_SIGNERS: ${TINKER_EXECUTION_POLICY_APPROVED_SIGNERS:-}
      TINKER_EXECUTION_POLICY_APPROVER_ROOT_HASH: ${TINKER_EXECUTION_POLICY_APPROVER_ROOT_HASH:-}
      TINKER_EXECUTION_POLICY_APPROVAL_DOMAIN: ${TINKER_EXECUTION_POLICY_APPROVAL_DOMAIN:-}
      TINKER_EXECUTION_POLICY_ANCHOR_RPC_URL: ${TINKER_EXECUTION_POLICY_ANCHOR_RPC_URL:-}
      TINKER_EXECUTION_POLICY_ANCHOR_ADDRESS: ${TINKER_EXECUTION_POLICY_ANCHOR_ADDRESS:-}
      TINKER_EXECUTION_POLICY_ANCHOR_RUNTIME_CODE_HASH: ${TINKER_EXECUTION_POLICY_ANCHOR_RUNTIME_CODE_HASH:-}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_ADDRESS: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_ADDRESS:-}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_RELEASE_COMMITMENT: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_RELEASE_COMMITMENT:-}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_KEY_PATH: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_KEY_PATH:-tinker/execution_policy_anchor_writer}
      TINKER_EXECUTION_POLICY_ANCHOR_CONFIRMATIONS: ${TINKER_EXECUTION_POLICY_ANCHOR_CONFIRMATIONS:-12}
      TINKER_EXECUTION_POLICY_ANCHOR_POLL_INTERVAL_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_POLL_INTERVAL_SECONDS:-1}
      TINKER_EXECUTION_POLICY_ANCHOR_CONFIRMATION_WAIT_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_CONFIRMATION_WAIT_SECONDS:-60}
      TINKER_EXECUTION_POLICY_ANCHOR_MAX_BLOCK_AGE_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_MAX_BLOCK_AGE_SECONDS:-3600}
      TINKER_EXECUTION_POLICY_ANCHOR_MAX_FUTURE_BLOCK_SKEW_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_MAX_FUTURE_BLOCK_SKEW_SECONDS:-30}
      TINKER_FUNDING_PREFLIGHT_ALLOWED_HOSTS: ${TINKER_FUNDING_PREFLIGHT_ALLOWED_HOSTS:-}
      TINKER_EVALUATOR_MODE: "deterministic"
      TINKER_DILIGENCE_EVALUATOR_RELEASE_MANIFEST_PATH: ${TINKER_DILIGENCE_EVALUATOR_RELEASE_MANIFEST_PATH:?Reviewed Diligence evaluator release manifest path required}
      TINKER_DILIGENCE_EVALUATOR_RELEASE_MANIFEST_SHA256: ${TINKER_DILIGENCE_EVALUATOR_RELEASE_MANIFEST_SHA256:?Reviewed Diligence evaluator release manifest SHA-256 required}
      TINKER_DILIGENCE_EVALUATOR_POLICY_SET_ROOT: ${TINKER_DILIGENCE_EVALUATOR_POLICY_SET_ROOT:?Reviewed Diligence evaluator policy-set root required}
      TINKER_DILIGENCE_CHAIN_ID: ${TINKER_DILIGENCE_CHAIN_ID:?Reviewed Diligence chain ID required}
      TINKER_DILIGENCE_ROOM_ADDRESS: ${TINKER_DILIGENCE_ROOM_ADDRESS:?Reviewed DiligenceRoom address required}
      TINKER_CHAIN_CONTRACT_ADDRESS: ${TINKER_CHAIN_CONTRACT_ADDRESS:?DiligenceRoom address required}
      TINKER_BROWSER_SESSION_STORE_PATH: /data/browser_session.enc
      TINKER_BROWSER_SESSION_KEY_PATH: tinker/browser_session
      TINKER_FUNDING_RECEIPT_STORE_PATH: /data/funding_receipts.enc
      TINKER_FUNDING_RECEIPT_KEY_PATH: tinker/funding_receipts
      TINKER_RUN_METADATA_STORE_PATH: /data/run_metadata.enc
      TINKER_RUN_METADATA_KEY_PATH: tinker/run_metadata
      TINKER_FUNDING_MODE: ${TINKER_FUNDING_MODE:-manual_prefund}
      TINKER_MIN_ADD_BALANCE_USD: ${TINKER_MIN_ADD_BALANCE_USD:-10.0}
      TINKER_MAX_ADD_BALANCE_USD: ${TINKER_MAX_ADD_BALANCE_USD:-10.0}
      TINKER_ALLOW_ADD_BALANCE_ENDPOINT: ${TINKER_ALLOW_ADD_BALANCE_ENDPOINT:-false}
      DSTACK_ENABLED: "true"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - diligence-evaluator-policy:/sealed/diligence:ro
    networks:
      - oracle-net

  arena-policy-init:
    profiles: ["arena-runtime"]
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    command: ["tinker-arena-provision"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    volumes:
      - arena-worker-sealed:/sealed
    environment:
      TINKER_ARENA_PROVISION_RELEASE_B64: ${TINKER_ARENA_PROVISION_RELEASE_B64:?Encrypted canonical Arena release v2 base64url required}
      TINKER_ARENA_PROVISION_EVALUATOR_B64: ${TINKER_ARENA_PROVISION_EVALUATOR_B64:?Encrypted canonical sealed evaluator base64url required}
      TINKER_ARENA_PROVISION_RELEASE_SHA256: ${TINKER_ARENA_WORKER_RELEASE_MANIFEST_SHA256:?Arena release v2 SHA-256 required}
      TINKER_ARENA_PROVISION_EVALUATOR_SHA256: ${TINKER_ARENA_PROVISION_EVALUATOR_SHA256:?Sealed evaluator SHA-256 required}
      TINKER_ARENA_PROVISION_AUTH_KEY_B64: ${TINKER_ARENA_PROVISION_AUTH_KEY_B64:?Encrypted 32-byte provision authentication key required}
      TINKER_ARENA_PROVISION_AUTH_TAG: ${TINKER_ARENA_PROVISION_AUTH_TAG:?Authenticated Arena provision envelope tag required}

  arena-worker:
    profiles: ["arena-runtime"]
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    command: ["tinker-arena-worker"]
    restart: unless-stopped
    ulimits:
      core: 0
    depends_on:
      delegate:
        condition: service_healthy
      arena-policy-init:
        condition: service_completed_successfully
    volumes:
      - delegate-data:/data
      - arena-worker-sealed:/sealed:ro
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      DSTACK_ENABLED: "true"
      DSTACK_SIMULATOR_ENDPOINT: ""
      # These are aliases of release-authorized values, not a second operator
      # lineage namespace for the Arena worker.
      TINKER_MAIN_RUNTIME_CVM_ID: ${TINKER_COMPUTE_WORKLOAD_CVM_ID:?Canonical main runtime CVM ID required}
      TINKER_RELEASE_DEPLOYMENT_INTENT_SHA256: ${TINKER_COMPUTE_WORKLOAD_DEPLOYMENT_INTENT_SHA256:?Signed seven-CVM deployment intent required}
      TINKER_RELEASE_AUTHORITY_SHA256: ${TINKER_COMPUTE_WORKLOAD_RELEASE_AUTHORITY_SHA256:?Canonical release authority required}
      TINKER_RELEASE_CEREMONY_NONCE: ${TINKER_COMPUTE_WORKLOAD_CEREMONY_NONCE:?Release ceremony nonce required}
      TINKER_ARENA_QVL_MEASUREMENT_POLICY_SHA256: ${TINKER_ARENA_QVL_MEASUREMENT_POLICY_SHA256:?Linked Arena QVL measurement policy required}
      TINKER_CHAIN_RPC_URL: ${TINKER_CHAIN_RPC_URL:?Base Sepolia HTTPS RPC URL required}
      TINKER_ARENA_STORE_PATH: /data/arena_state.json
      TINKER_ARENA_CANDIDATE_INGRESS_STORE_PATH: /data/arena_candidates
      TINKER_ARENA_CANDIDATE_INGRESS_KEY_PATH: ${TINKER_ARENA_CANDIDATE_INGRESS_KEY_PATH:-tinker/arena_candidate_ingress}
      TINKER_ARENA_CANDIDATE_INGRESS_LOCAL_KEY_FILE: ""
      TINKER_ARENA_CANDIDATE_INGRESS_PRIVATE_KEY_HEX: ""
      TINKER_EXECUTION_POLICY_STORE_PATH: /data/execution_policy_state.json
      TINKER_EXECUTION_POLICY_STORE_INTEGRITY_KEY: ""
      TINKER_EXECUTION_POLICY_STORE_INTEGRITY_KEY_PATH: ${TINKER_EXECUTION_POLICY_STORE_INTEGRITY_KEY_PATH:-tinker/execution_policy_store_integrity}
      TINKER_EXECUTION_POLICY_APPROVED_SIGNERS: ${TINKER_EXECUTION_POLICY_APPROVED_SIGNERS:?Arena policy approver addresses required}
      TINKER_EXECUTION_POLICY_APPROVER_ROOT_HASH: ${TINKER_EXECUTION_POLICY_APPROVER_ROOT_HASH:?Arena policy approver root required}
      TINKER_EXECUTION_POLICY_APPROVAL_DOMAIN: ${TINKER_EXECUTION_POLICY_APPROVAL_DOMAIN:?Deployment-unique Arena policy domain required}
      TINKER_EXECUTION_POLICY_ANCHOR_RPC_URL: ${TINKER_EXECUTION_POLICY_ANCHOR_RPC_URL:?Execution-policy anchor Base Sepolia HTTPS RPC URL required}
      TINKER_EXECUTION_POLICY_ANCHOR_ADDRESS: ${TINKER_EXECUTION_POLICY_ANCHOR_ADDRESS:?Execution-policy anchor contract address required}
      TINKER_EXECUTION_POLICY_ANCHOR_RUNTIME_CODE_HASH: ${TINKER_EXECUTION_POLICY_ANCHOR_RUNTIME_CODE_HASH:?Execution-policy anchor runtime code hash required}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_ADDRESS: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_ADDRESS:?Execution-policy anchor writer address required}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_RELEASE_COMMITMENT: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_RELEASE_COMMITMENT:?Execution-policy anchor writer release commitment required}
      TINKER_EXECUTION_POLICY_ANCHOR_CONFIRMATIONS: ${TINKER_EXECUTION_POLICY_ANCHOR_CONFIRMATIONS:-12}
      TINKER_EXECUTION_POLICY_ANCHOR_POLL_INTERVAL_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_POLL_INTERVAL_SECONDS:-1}
      TINKER_EXECUTION_POLICY_ANCHOR_CONFIRMATION_WAIT_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_CONFIRMATION_WAIT_SECONDS:-60}
      TINKER_EXECUTION_POLICY_ANCHOR_MAX_BLOCK_AGE_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_MAX_BLOCK_AGE_SECONDS:-3600}
      TINKER_EXECUTION_POLICY_ANCHOR_MAX_FUTURE_BLOCK_SKEW_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_MAX_FUTURE_BLOCK_SKEW_SECONDS:-30}
      TINKER_ARENA_WORKER_RELEASE_MANIFEST_PATH: /sealed/arena/release-v2.json
      TINKER_ARENA_WORKER_RELEASE_MANIFEST_SHA256: ${TINKER_ARENA_WORKER_RELEASE_MANIFEST_SHA256:?Arena release v2 SHA-256 required}
      TINKER_ARENA_WORKER_EVALUATOR_PATH: /sealed/arena/sealed-evaluator-v1.json
      TINKER_ARENA_WORKER_QVL_VERDICT_PATH: ""
      TINKER_ARENA_WORKER_QVL_VERDICT_URL: ${TINKER_ARENA_WORKER_QVL_VERDICT_URL:?Independent QVL HTTPS URL required}
      TINKER_ARENA_WORKER_QVL_RELEASE_POLICY_HASH: ${TINKER_ARENA_WORKER_QVL_RELEASE_POLICY_HASH:?Independent QVL release policy hash required}
      TINKER_ARENA_WORKER_QVL_AUTH_TOKEN: ${TINKER_ARENA_WORKER_QVL_AUTH_TOKEN:?Independent QVL bearer required}
      TINKER_ARENA_WORKER_POLL_INTERVAL_SECONDS: ${TINKER_ARENA_WORKER_POLL_INTERVAL_SECONDS:-1.0}
      TINKER_ARENA_WORKER_LIVE_CAPABILITY_ENABLED: "true"
      TINKER_ARENA_WORKER_RELEASE_SHA: ${TINKER_ARENA_WORKER_RELEASE_SHA:-}
      TINKER_ARENA_WORKER_IMAGE_DIGEST: ${TINKER_ARENA_WORKER_IMAGE_DIGEST:-}
      TINKER_ARENA_WORKER_APPROVED_CHALLENGE_SET_SHA256: ${TINKER_ARENA_REGISTRY_APPROVED_CHALLENGE_SET_SHA256:?Authorized ChallengeRegistry challenge-set digest required}
      TINKER_ARENA_WORKER_RELEASE_POLICY_COMMITMENT: ${TINKER_ARENA_WORKER_RELEASE_POLICY_COMMITMENT:-}
      TINKER_ARENA_WORKER_COMPOSE_HASH: ${TINKER_ARENA_WORKER_COMPOSE_HASH:-}
      TINKER_ARENA_WORKER_APP_ID: ${TINKER_ARENA_WORKER_APP_ID:-}
      TINKER_ARENA_WORKER_OS_IMAGE_HASH: ${TINKER_ARENA_WORKER_OS_IMAGE_HASH:-}
      TINKER_ARENA_WORKER_HEARTBEAT_PATH: /data/arena_worker_heartbeat.json
      TINKER_ARENA_WORKER_HEARTBEAT_TTL_SECONDS: ${TINKER_ARENA_WORKER_HEARTBEAT_TTL_SECONDS:-30}
      TINKER_ARENA_WORKER_HEARTBEAT_KEY_PATH: ${TINKER_ARENA_WORKER_HEARTBEAT_KEY_PATH:-tinker/arena_worker_heartbeat}
      TINKER_ARENA_WORKER_HEARTBEAT_INTEGRITY_KEY: ""
    networks:
      - oracle-net

  # One-shot release ceremony only. The QVL bearer is deliberately absent from
  # every long-running service, and this container receives neither /data nor
  # the sealed Arena volume. Its sole bounded output is the independently
  # signed writer-evidence artifact; the raw quote travels only to HTTPS QVL.
  anchor-writer-evidence:
    profiles: ["anchor-writer-ceremony"]
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    command: ["tinker-execution-policy-anchor-writer"]
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      DSTACK_ENABLED: "true"
      DSTACK_SIMULATOR_ENDPOINT: ""
      TINKER_EXECUTION_POLICY_ANCHOR_ADDRESS: ${TINKER_EXECUTION_POLICY_ANCHOR_ADDRESS:?Execution-policy anchor contract address required}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_ADDRESS: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_ADDRESS:?Execution-policy anchor writer address required}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_RELEASE_COMMITMENT: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_RELEASE_COMMITMENT:?Execution-policy anchor writer release commitment required}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_KEY_PATH: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_KEY_PATH:-tinker/execution_policy_anchor_writer}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_QVL_URL: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_QVL_URL:?Separate anchor-writer QVL HTTPS /verify URL required}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_QVL_VERIFIER_ADDRESS: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_QVL_VERIFIER_ADDRESS:?Reviewed anchor-writer QVL verifier address required}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_QVL_RELEASE_POLICY_HASH: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_QVL_RELEASE_POLICY_HASH:?Reviewed anchor-writer QVL policy hash required}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_QVL_MAX_VERDICT_AGE_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_QVL_MAX_VERDICT_AGE_SECONDS:-300}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_QVL_AUTH_TOKEN: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_QVL_AUTH_TOKEN:?Phala-encrypted anchor-writer QVL bearer required}
    networks:
      - oracle-net

  # Optional until the compiled Tinker adapter's external dispatch-id replay
  # contract is release-approved. When enabled, this worker shares both the
  # exact-asset journal and execution-policy inode lease with the API.
  compute-execution-worker:
    profiles: ["compute-execution"]
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    command: ["tinker-compute-runtime", "--poll"]
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    depends_on:
      delegate:
        condition: service_healthy
    volumes:
      - delegate-data:/data
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      DSTACK_ENABLED: "true"
      DSTACK_SIMULATOR_ENDPOINT: ""
      TINKER_COMPUTE_DISPATCH_STORE_PATH: /data/compute_exact_asset_dispatch.json
      TINKER_COMPUTE_DISPATCH_STORE_INTEGRITY_KEY: ""
      TINKER_COMPUTE_DISPATCH_STORE_INTEGRITY_KEY_PATH: ${TINKER_COMPUTE_DISPATCH_STORE_INTEGRITY_KEY_PATH:-tinker/compute_dispatch_store_integrity}
      TINKER_COMPUTE_CHAIN_RPC_URL: ${TINKER_COMPUTE_CHAIN_RPC_URL:?Compute vault Base Sepolia HTTPS RPC URL required}
      TINKER_COMPUTE_VAULT_ADDRESS: ${TINKER_COMPUTE_VAULT_ADDRESS:?Compute vault address required}
      TINKER_COMPUTE_VAULT_RUNTIME_CODE_HASH: ${TINKER_COMPUTE_VAULT_RUNTIME_CODE_HASH:?Compute vault runtime code hash required}
      TINKER_COMPUTE_VAULT_COMPOSE_HASH: ${TINKER_COMPUTE_VAULT_COMPOSE_HASH:?Compute execution compose hash required}
      TINKER_COMPUTE_METERING_POLICY_SET_HASH: ${TINKER_COMPUTE_METERING_POLICY_SET_HASH:?Compute metering policy-set hash required}
      TINKER_COMPUTE_EXECUTION_SIGNER_KEY_PATH: ${TINKER_COMPUTE_EXECUTION_SIGNER_KEY_PATH:-tinker/compute_execution_identity}
      TINKER_COMPUTE_METERING_URL: ${TINKER_COMPUTE_METERING_URL:?Authenticated independent metering HTTPS URL required}
      TINKER_COMPUTE_METERING_AUTH_TOKEN: ${TINKER_COMPUTE_METERING_AUTH_TOKEN:?Independent metering bearer required}
      TINKER_COMPUTE_EXECUTION_CONFIRMATIONS: ${TINKER_COMPUTE_EXECUTION_CONFIRMATIONS:-2}
      TINKER_COMPUTE_EXECUTION_POLL_INTERVAL_SECONDS: ${TINKER_COMPUTE_EXECUTION_POLL_INTERVAL_SECONDS:-1.0}
      TINKER_COMPUTE_EXECUTION_MAX_BLOCK_AGE_SECONDS: ${TINKER_COMPUTE_EXECUTION_MAX_BLOCK_AGE_SECONDS:-300}
      TINKER_COMPUTE_EXECUTION_MAX_FUTURE_BLOCK_SKEW_SECONDS: ${TINKER_COMPUTE_EXECUTION_MAX_FUTURE_BLOCK_SKEW_SECONDS:-30}
      TINKER_EXECUTION_POLICY_STORE_PATH: /data/execution_policy_state.json
      TINKER_EXECUTION_POLICY_STORE_INTEGRITY_KEY: ""
      TINKER_EXECUTION_POLICY_STORE_INTEGRITY_KEY_PATH: ${TINKER_EXECUTION_POLICY_STORE_INTEGRITY_KEY_PATH:-tinker/execution_policy_store_integrity}
      TINKER_EXECUTION_POLICY_APPROVED_SIGNERS: ${TINKER_EXECUTION_POLICY_APPROVED_SIGNERS:?Compute policy approver addresses required}
      TINKER_EXECUTION_POLICY_APPROVER_ROOT_HASH: ${TINKER_EXECUTION_POLICY_APPROVER_ROOT_HASH:?Compute policy approver root required}
      TINKER_EXECUTION_POLICY_APPROVAL_DOMAIN: ${TINKER_EXECUTION_POLICY_APPROVAL_DOMAIN:?Deployment-unique Compute policy domain required}
      TINKER_EXECUTION_POLICY_ANCHOR_RPC_URL: ${TINKER_EXECUTION_POLICY_ANCHOR_RPC_URL:?Execution-policy anchor Base Sepolia HTTPS RPC URL required}
      TINKER_EXECUTION_POLICY_ANCHOR_ADDRESS: ${TINKER_EXECUTION_POLICY_ANCHOR_ADDRESS:?Execution-policy anchor contract address required}
      TINKER_EXECUTION_POLICY_ANCHOR_RUNTIME_CODE_HASH: ${TINKER_EXECUTION_POLICY_ANCHOR_RUNTIME_CODE_HASH:?Execution-policy anchor runtime code hash required}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_ADDRESS: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_ADDRESS:?Execution-policy anchor writer address required}
      TINKER_EXECUTION_POLICY_ANCHOR_WRITER_RELEASE_COMMITMENT: ${TINKER_EXECUTION_POLICY_ANCHOR_WRITER_RELEASE_COMMITMENT:?Execution-policy anchor writer release commitment required}
      TINKER_EXECUTION_POLICY_ANCHOR_CONFIRMATIONS: ${TINKER_EXECUTION_POLICY_ANCHOR_CONFIRMATIONS:-12}
      TINKER_EXECUTION_POLICY_ANCHOR_POLL_INTERVAL_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_POLL_INTERVAL_SECONDS:-1}
      TINKER_EXECUTION_POLICY_ANCHOR_CONFIRMATION_WAIT_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_CONFIRMATION_WAIT_SECONDS:-60}
      TINKER_EXECUTION_POLICY_ANCHOR_MAX_BLOCK_AGE_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_MAX_BLOCK_AGE_SECONDS:-3600}
      TINKER_EXECUTION_POLICY_ANCHOR_MAX_FUTURE_BLOCK_SKEW_SECONDS: ${TINKER_EXECUTION_POLICY_ANCHOR_MAX_FUTURE_BLOCK_SKEW_SECONDS:-30}
    networks:
      - oracle-net

volumes:
  arena-worker-sealed:
  diligence-evaluator-policy:

networks:
  oracle-net:
    external: true
    name: tee-email-oracle_oracle-net
