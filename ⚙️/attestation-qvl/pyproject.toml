[project]
name = "dnai-attestation-qvl"
version = "0.1.0"
description = "Independent policy-pinned Intel TDX DCAP quote verifier for DNAI Wikigen"
requires-python = "==3.12.*"
dependencies = [
    "dcap-qvl==0.5.2",
    "dstack-sdk==0.5.3",
    "eth-account==0.13.7",
    "fastapi==0.135.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "uvicorn==0.41.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[project.scripts]
dnai-attestation-qvl = "attestation_qvl.main:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attestation_qvl"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "asyncio: run an async test",
]
