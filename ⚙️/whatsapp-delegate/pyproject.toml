[project]
name = "whatsapp-delegate"
version = "0.1.0"
description = "WhatsApp data delegation: browser-automated export sealed inside a TEE, owner-approved pipeline access only"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "cryptography>=44.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
